services:
  - type: web
    name: neuroauth-auth
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAKE_DOC_WEBHOOK
        sync: false
      - key: MAKE_BILLING_WEBHOOK
        sync: false

  - type: web
    name: nri-api-production
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app_nri.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://kkcojqlzmskuznbaxwqy.supabase.co
      - key: SUPABASE_JWKS_URL
        value: https://kkcojqlzmskuznbaxwqy.supabase.co/auth/v1/.well-known/jwks.json
      - key: NRI_TABLE
        value: internacoes
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
